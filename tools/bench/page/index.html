<html lang="de"><head><meta charset="utf-8"><title>Brett als Bild</title>

<body><main><img id="b" src="chesscom-00.png" alt="Brett"><aside><h1>Partie als Bild</h1><p>Diese Seite zeigt das Brett nur als Bild – kein lesbares HTML.</p></aside></main>
